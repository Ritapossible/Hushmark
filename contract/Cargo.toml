[package]
name = "hushmark-anchor"
version = "0.1.0"
edition = "2021"
description = "Anchors Hushmark receipt hashes on NEAR: one receipt per review, never overwritten."
license = "Apache-2.0"
repository = "https://github.com/Ritapossible/Hushmark"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

