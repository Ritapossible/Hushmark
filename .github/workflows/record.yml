# Record real NEAR AI Cloud evidence for fixtures R1–R3 (docs/FIXTURES.md), run by hand.
# Uses the NEARAI_API_KEY repository secret; the evidence (no key) is kept as an artifact and
# committed under fixtures/recordings/ after review.
name: record

on:
  workflow_dispatch:
    inputs:
      model:
        description: NEAR AI Cloud model
        default: z-ai/glm-5.3-flash

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Record R1–R3
        env:
          NEARAI_API_KEY: ${{ secrets.NEARAI_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          uv run python scripts/record_completion.py --model "$MODEL" --out recordings \
            fixtures/inputs/r1 fixtures/inputs/r2 fixtures/inputs/r3
      - uses: actions/upload-artifact@v4
        with:
          name: recordings
          path: recordings/
          retention-days: 30
